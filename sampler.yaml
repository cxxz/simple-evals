# Sampler configurations for all supported models
# Each model configuration specifies:
# - sampler_type: The type of sampler class to use
# - params: Parameters to pass to the sampler constructor

o3-mini-high:
  sampler_type: OChatCompletionSampler
  params:
    model: o3-mini
    reasoning_effort: high
    provider: azure
    timeout: 1200

o4-mini-high:
  sampler_type: OChatCompletionSampler
  params:
    model: o4-mini
    reasoning_effort: high
    provider: azure
    timeout: 1200

gpt-4o-mini:
  sampler_type: ChatCompletionSampler
  params:
    model: gpt-4o-mini
    system_message: OPENAI_SYSTEM_MESSAGE_API
    max_tokens: 4096

deepseek-r1:
  sampler_type: ChatCompletionSampler
  params:
    model: DeepSeek-R1-AWQ
    max_tokens: 28000
    temperature: 0.6
    top_p: 0.95
    timeout: 1800

gpt-4o-2024-11-20:
  sampler_type: ChatCompletionSampler
  params:
    model: gpt-4o
    max_tokens: 4096
    provider: azure

gemini-2.0-flash:
  sampler_type: GeminiSampler
  params:
    model_name: gemini-2.0-flash-001
    max_tokens: 8192
    provider: vertex_ai

gemini-2.5-pro:
  sampler_type: GeminiSampler
  params:
    model_name: gemini-2.5-pro-preview-03-25
    temperature: 0.9
    max_tokens: 32768
    provider: gemini

# System messages referenced by multiple models
system_messages:
  OPENAI_SYSTEM_MESSAGE_API: "You are a helpful assistant."
  OPENAI_SYSTEM_MESSAGE_CHATGPT: "You are ChatGPT, a large language model trained by OpenAI, based on the GPT-4 architecture.\nKnowledge cutoff: 2023-12\nCurrent date: 2024-04-01"
  REFLECTION_SYS_MSG: "Think carefully and provide a step-by-step solution."
  SCIENCE_SYS_MSG: "You are a helpful assistant in science."
  SIMPLE_GPQA_SYS_MSG : "Always think like a top scientist."
  REFLECTION_SIMPLE_SYS_MSG : "You are a world-class AI system, capable of complex reasoning and reflection. Reason through the query inside <thinking> tags, and then provide your final response inside <output> tags. If you detect that you made a mistake in your reasoning at any point, correct yourself inside <reflection> tags."
